# Domain tunables -- edit freely without redeploying. Secrets go in .env instead (see .env.example).
# Loaded by careeros.infrastructure.config.settings.Settings, with env vars taking precedence over this file.

environment: development
log_level: INFO

scoring_weights:
  resume_match: 0.30
  skill_area_fit: 0.25
  career_progression_fit: 0.15
  remote_fit: 0.10
  salary_fit: 0.10
  company_quality: 0.10

llm:
  provider: ollama
  model: qwen3:8b
  base_url: http://localhost:11434
  timeout_seconds: 900
  keep_alive: 10m
  max_output_tokens: 800
  # Qwen3 reasons out loud by default. CareerOS stores the model's own narrative instead, and measurements on
  # this hardware showed ~35% faster scoring with thinking off.
  disable_thinking: true

scheduler:
  # Background discovery and scoring. Set to false while you are working in the dashboard: one local Ollama
  # instance serialises generation, so a scheduled scoring batch queues ahead of a tailoring request and times
  # it out. The batch can wait; you cannot.
  enabled: true

scoring:
  # Each job costs one local LLM call (~1 minute on a 4GB-VRAM laptop GPU), so the backlog is drained in
  # bounded, resumable slices rather than all at once.
  batch_size: 20
  interval_seconds: 900
  run_on_startup: false

profile:
  # Off by default so a profile the Memory module has adjusted is not silently reverted by a stale YAML file.
  # Seed explicitly with POST /profile/reload.
  seed_on_startup: false

feature_flags:
  auto_apply_enabled: false
  auto_tailor_resume: true
  notification_batching_window_minutes: 60

job_sources:
  greenhouse:
    enabled: true
    # Greenhouse publishes no cross-company search API, so you name the companies to watch. A token is the slug
    # in boards.greenhouse.io/<token>.
    #
    # These are chosen for companies that actually hire engineers in India. The earlier list (stripe, anthropic,
    # figma) is a cautionary tale: it returned 224 jobs of which only 4 were in India and the rest needed US work
    # authorisation, so the whole shortlist was unusable. Board tokens are guesses until a discovery run proves
    # them -- one that 404s is logged and skipped, so a wrong token costs nothing but yields nothing either.
    # VERIFIED by probing the API, not guessed. Each of these returns a live board with India-based engineering
    # roles; an earlier hand-written list had 14 of 17 tokens 404 because company names are not board slugs.
    # Re-probe before adding: a wrong token is silently skipped, so it costs nothing but yields nothing.
    board_tokens:
      - phonepe
      - gitlab
      - twilio
      - hackerrank
      - rubrik
      - druva
      - turing
      - postman
      - mongodb
      - zenoti
      - elastic

discovery:
  # Matched against the job TITLE only. This is the filter that matters: every job kept here later costs one
  # local LLM call to score, so keeping it tight is the difference between minutes and hours of inference.
  title_keywords:
    - ai
    - ml
    - machine learning
    - llm
    - applied scientist
    - backend
    - back end
    - python
    - full stack
    - fullstack
    - frontend
    - front end
    - react
    - node
    - software engineer
    - mobile
    - flutter
  # Matched anywhere including the description. Left empty on purpose -- almost every engineering description
  # mentions "engineer", so adding broad terms here re-introduces the noise title_keywords just removed.
  keywords: []
  remote_only: false
  # Where you can legally work. A posting naming only regions outside this list is dropped at the source --
  # this is work authorisation, not preference, so it filters rather than merely scoring lower. It also catches
  # region-locked remote ("US Remote", "Remote (US/Canada)"), which would otherwise slip through as plain remote.
  # Clear the list to disable the check.
  # Deliberately NOT including "remote": "US Remote" contains it, so listing it here would mark every
  # region-locked US role eligible and defeat the filter. Bare "Remote" with no region named is already kept as
  # unknown rather than dropped, and genuinely worldwide postings match on "worldwide"/"anywhere"/"global".
  eligible_locations:
    - india
    - pune
    - bangalore
    - bengaluru
    - mumbai
    - hyderabad
  interval_seconds: 21600
  run_on_startup: false

tracker:
  # Score at or above this promotes an application from Found to Interested automatically.
  auto_interested_threshold: 70
