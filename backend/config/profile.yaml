# Your career profile -- the "who am I" that every job is scored against.
#
# Populated from resume-current.tex. This file is the seed: it is loaded into the database
# (POST /profile/reload), and from then on the database copy is what scoring reads -- so the Memory module has
# somewhere durable to record learned adjustments without fighting this file.
#
# Nothing here is secret, so it is committed. Credentials belong in .env.

headline: Full Stack Developer (AI / LLM systems)

summary: >
  Full Stack Developer at CloudMotiv building AI-powered platforms end to end: a document intelligence
  product that turns PDFs into structured insights, an ML-based drone health monitoring system with
  predictive maintenance, and StackIQ, a harness-level AI/SaaS utilization diagnostic for Claude. Previously
  shipped React Native modules at Syngenta used in apps serving 3M+ growers, and co-authored two IEEE
  publications plus a paper under review at ACM CHI. B.Tech in Computer Engineering from VIT Pune (CGPA
  8.64/10), comfortable across Python/TypeScript backends, React and React Native front ends, and
  LLM/RAG workflows.

# NOTE: this counts substantial internship work (Revogreen Sep 2022, VIT research Jun 2024, Syngenta Jan-Jul
# 2025) alongside the current full-time role from Nov 2025. Full-time-only would read closer to 1.
# This number materially moves career_progression_fit on every score, so change it to whatever you would
# actually tell a recruiter.
years_experience: 2

# Ranked 1-5, matching the star ratings you gave. Role fit is scored against these, so your ranking is data --
# the model is never left to guess what you want.
role_interests:
  - { title: AI Automation Engineer, priority: 5 }
  - { title: AI Engineer, priority: 5 }
  - { title: Applied AI Engineer, priority: 5 }
  - { title: LLM Engineer, priority: 5 }
  - { title: Backend Engineer, priority: 4 }
  - { title: Python Engineer, priority: 4 }
  - { title: Full Stack Engineer, priority: 4 }
  - { title: MERN Stack Developer, priority: 4 }
  - { title: Software Engineer, priority: 4 }
  - { title: React Developer, priority: 4 }
  - { title: Next.js Developer, priority: 4 }
  - { title: Frontend Engineer, priority: 4 }
  - { title: React Native Developer, priority: 4 }
  - { title: Flutter Developer, priority: 4 }

