# THE ACHIEVEMENT BANK -- the only content a tailored resume may draw from.
#
# Transcribed verbatim from resume-current.tex. Nothing here was invented or embellished: every bullet is a
# statement already on the resume, with \textbf{...} converted to **...** (the one markup form the bank
# supports; it renders as bold and nothing else can get through).
#
# Enforced in code:
#   - ids must be unique; every achievement needs at least one bullet; strength is 1-5
#   - tailoring may only select ids and bullet indices that exist here
#   - a reworded bullet may drop figures but never introduce new ones
#   - claimed skills must appear in config/profile.yaml or in a technologies list below
#
# So the honesty of every generated resume is exactly the honesty of this file. Add new work here as it
# happens; that is also how you clear the gap flags CareerOS raises.
#
# YAML note: bullets use block scalars (`>-`) rather than plain or quoted strings. Plain scalars break on this
# content -- a "word: **bold**" sequence makes YAML read a mapping whose value starts with `*`, which it then
# treats as an alias reference and rejects. Block scalars need no escaping at all, so apostrophes, colons,
# quotes and asterisks are all safe.

